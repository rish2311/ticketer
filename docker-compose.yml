# ============================================
# Flash Sale Ticket Booking Engine
# Docker Compose - Full Stack
# ============================================

services:
  # ──────────────────────────────────────────
  # Data Layer
  # ──────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: ticketer-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - ticketer-net

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ticketer-pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: ${PGBOUNCER_POOL_MODE}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN}
      AUTH_TYPE: scram-sha-256
    ports:
      - "${PGBOUNCER_PORT}:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - ticketer-net

  redis:
    image: redis:7.2-alpine
    container_name: ticketer-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy noeviction
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - ticketer-net

  # ──────────────────────────────────────────
  # Messaging Layer
  # ──────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ticketer-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticketer-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ticketer-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 15
    networks:
      - ticketer-net

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ticketer-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1 --topic ${KAFKA_TOPIC_ORDERS}
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1 --topic ${KAFKA_TOPIC_DLQ}
      echo 'Kafka topics created successfully!'
      kafka-topics --list --bootstrap-server kafka:9092
      "
    networks:
      - ticketer-net

  # ──────────────────────────────────────────
  # Observability Layer
  # ──────────────────────────────────────────

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: ticketer-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    networks:
      - ticketer-net

  prometheus:
    image: prom/prometheus:latest
    container_name: ticketer-prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - ticketer-net

  grafana:
    image: grafana/grafana:latest
    container_name: ticketer-grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - ticketer-net

  # ──────────────────────────────────────────
  # Application Services
  # ──────────────────────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: ticketer-api-gateway
    ports:
      - "${API_PORT}:8080"
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_BROKER=${KAFKA_BROKER}
      - KAFKA_TOPIC_ORDERS=${KAFKA_TOPIC_ORDERS}
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - API_PORT=${API_PORT}
      - TICKET_INVENTORY=${TICKET_INVENTORY}
      - LOCK_TTL_SECONDS=${LOCK_TTL_SECONDS}
      - JAEGER_ENDPOINT=${JAEGER_ENDPOINT}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - ticketer-net

  order-worker:
    build:
      context: .
      dockerfile: services/order-worker/Dockerfile
    container_name: ticketer-order-worker
    ports:
      - "${WORKER_METRICS_PORT}:9091"
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_BROKER=${KAFKA_BROKER}
      - KAFKA_TOPIC_ORDERS=${KAFKA_TOPIC_ORDERS}
      - KAFKA_TOPIC_DLQ=${KAFKA_TOPIC_DLQ}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID}
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - WORKER_PAYMENT_SUCCESS_RATE=${WORKER_PAYMENT_SUCCESS_RATE}
      - WORKER_MAX_RETRIES=${WORKER_MAX_RETRIES}
      - WORKER_CONSUMER_COUNT=${WORKER_CONSUMER_COUNT}
      - WORKER_METRICS_PORT=${WORKER_METRICS_PORT}
      - JAEGER_ENDPOINT=${JAEGER_ENDPOINT}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - ticketer-net

  ui-client:
    build:
      context: ./ui-client
      dockerfile: Dockerfile
    container_name: ticketer-ui
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${API_PORT}
      - NEXT_PUBLIC_WS_URL=ws://localhost:${API_PORT}/ws
    depends_on:
      - api-gateway
    networks:
      - ticketer-net

# ──────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

# ──────────────────────────────────────────
# Networks
# ──────────────────────────────────────────
networks:
  ticketer-net:
    driver: bridge
